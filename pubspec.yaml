name: sonora
description: A music streaming app.
version: 1.9.0+76
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Core Utilities ────────────────────────────────────────────
  path: ^1.9.0
  args: ^2.7.0
  # Keep screen awake on Android while lyrics view is open.
  # 1.8.1+ needs dbus ^0.8; audio_service_mpris 0.2.1 pins dbus ^0.7.
  wakelock_plus: ^1.8.0

  # ── YTMusic Data Layer ────────────────────────────────────────
  #dart_ytmusic_api:
  #  path: ../dart_ytmusic_api
  dart_ytmusic_api:
    git:
      url: https://github.com/gmstyle/dart_ytmusic_api.git

  youtube_explode_dart:
    #path: ../youtube_explode_dart
    git:
      url: https://github.com/gmstyle/youtube_explode_dart.git

  # ── Audio Playback ────────────────────────────────────────────
  audio_session: ^0.2.3
  just_audio: ^0.10.4
  # Linux backend for just_audio (libmpv via media_kit). Not used on Android.
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.1.3
  audio_service: ^0.18.18
  audio_service_platform_interface: ^0.1.3
  audio_service_mpris: ^0.2.1

  # ── Linux Desktop ────────────────────────────────────────────
  # 0.8+ rewrites onto nativeapi (breaking API). Stay on 0.5 until tray code migrates.
  tray_manager: ^0.5.2
  window_manager: ^0.6.0

  # ── State Management ──────────────────────────────────────────
  flutter_riverpod: ^3.5.0
  collection: ^1.19.1

  # ── Navigation ────────────────────────────────────────────────
  go_router: ^18.0.1

  # ── Local Database ────────────────────────────────────────────
  drift: ^2.35.2
  drift_flutter: ^0.3.1

  # ── File System & Permissions ─────────────────────────────────
  path_provider: ^2.1.6
  permission_handler: ^13.0.0

  # ── Download / HTTP ──────────────────────────────────────────
  dio: ^5.9.2
  # Direct import in ytm_session_http_client (shared YTM cookie jar for streams).
  http: ^1.6.0
  # 7.3.2+ needs nm ^0.6 → dbus ^0.8; audio_service_mpris 0.2.1 pins dbus ^0.7.
  connectivity_plus: ^7.3.1

  # ── Images ──────────────────────────────────────────────────
  cached_network_image: ^4.0.0
  flutter_svg: ^2.3.0

  # ── Sharing & Deep Links ──────────────────────────────────────
  share_plus: ^13.3.1
  app_links: ^7.2.2

  # ── App Info & Update Check ───────────────────────────────────
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.3
  

  # ── Casting & Connectivity ──────────────────────────────────
  dart_cast: ^0.7.3
  flutter_multicast_lock: ^1.2.1

  # ── UI-UX ────────────────────────────────────────────────────────
  material_ui: ^1.10.0
  shimmer: ^4.0.0
  palette_generator_master: ^1.1.0
  google_fonts: ^9.0.0
  lucide_icons_flutter: ^4.0.2

  # ── Settings ─────────────────────────────────────────────────
  shared_preferences: ^2.5.6
  # ── Localizzazione ────────────────────────────────────────────
  intl: any

  # ── Backup ──────────────────────────────────────
  archive: ^4.2.0

  # ── File Picker ──────────────────────────────────────────────
  file_picker: ^13.3.2

  # ── Notifications ────────────────────────────────────────────────
  flutter_local_notifications: ^23.0.0
  flutter_local_notifications_linux: ^9.0.0
  
  # ── Local Synchronization ────────────────────────────────────────
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  flutter_edge_ai: ^2.4.0
  flutter_edge_ai_litertlm: ^1.14.0
  genkit: ^1.0.0
  genkit_google_genai: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.2
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

  http_parser: any
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "ic_launcher"
  # Android (< 8.0)
  image_path_android: "assets/logo_full.png" 
  
  # For Android > 8.0 (Adaptive Icons)
  adaptive_icon_background: "#131429" 
  adaptive_icon_foreground: "assets/logo_foreground.png" 

flutter_native_splash:
  color: "#131429"
  image: assets/logo_full.png
  android: true
  android_gravity: center
  fullscreen: true
